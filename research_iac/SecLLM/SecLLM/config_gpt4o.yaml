smells:
  - name: "Admin by default"
    prefilterRegEx: |
      ^\d+\.\s*[^#\s].*$
    analysisStart: "<security_audit>"
    analysisEnd: "</security_audit>"
    #model:
    #  default: "$"
    #  puppet: "gpt-4o"
    prompt:
      default: |
        # CONTEXT #
        The smell 'Admin by default' refers to the pattern of explicitly assigning well-known default users as administrative users in configuration scripts. This can violate the ‘principle of least privilege,’ which recommends that systems should be designed to provide the least amount of access necessary by default. Well-known default admin usernames include `root`, `admin`, `administrator`, or any other platform-specific accounts known to have elevated privileges by default.

        #########

        # OBJECTIVE #
        Your task is to analyze the following configuration script to identify any explicit assignments of well-known default admin usernames to variables or parameters, specifically focusing on those that are hard-coded values.  
        - Review all rows where a username is explicitly assigned as a parameter or attribute (e.g., `user =>`)
        - **Only consider explicit assignments of usernames that are hard-coded values and are not empty, null, or 'undef'.** The presence of a well-known username in the name of a parameter or variable (e.g., `root_password`) does not constitute an explicit assignment of that username.
        - **Focus specifically on assignments that represent usernames for user execution (e.g., `user =>`) and include all relevant lines, even if they appear in different contexts (e.g., within `exec` resources).** 
        - Disregard any assignment related to resource permissions and control settings or other attributes that do not represent user execution.
        - For each identified username, determine if it is a "well-known default admin user" as defined above. 
        - Avoid processing specific identifiers related to user roles or access when dealing with data manipulation operations.
        - Ignore any username in configurations of directories or variables specifying paths, such as default['...']['root']
        - Ignore any assignments of usernames that are derived from other variables or parameters, as these are not considered hard-coded. 
        - Service-specific usernames (e.g., `elasticsearch`, `mysql`, `postgres`) are **not** considered default admin users.
        - The presence of the term "admin" in variable names does not constitute an explicit assignment of a username.
        - Ensure that all explicit assignments of usernames are accounted for, regardless of their context.

        #########

        # STYLE #
        Be concise.

        #########

        # RESPONSE FORMAT #
        REASON: step by step reasoning, clearly stating whether any violations were found and why.
        VERIFICATION: double-check if all the instructions have been followed. In particular, have you verified that an assignment of a username is explicit and not empty, null, or 'undef'? Have you excluded service-specific usernames (e.g., `elasticsearch`, `mysql`, `postgres`) which are not considered default admin users?
        ANSWER: comma-separated list of line numbers containing any explicit assignments that are well-known default admin usernames, or state "None" if none exist.

        #########

        # SCRIPT #
        {script}

        #########

        **Important:** Disregard any aspects related to resource permissions and control settings

        **Crucial:** Avoid processing specific identifiers related to user roles or access when dealing with data manipulation operations

        REASON: 
        VERIFICATION: 
        ANSWER:   
      ansible: |
        # CONTEXT #
        You are a skilled security auditor tasked with analyzing configuration scripts for potential security vulnerabilities. Your primary focus is on identifying username assignments, username uses as part of a resource declaration,  or username uses in execution contexts,  which could violate the principle of least privilege.


        #########

        # OBJECTIVE #
        Your task is to thoroughly examine this script for three specific types of security concerns:
        1. Look for explicit assignments of default admin usernames such as 'root', 'admin', 'administrator', etc., as variables in `vars` or `group_vars`. Ensure these are not used outside ownership contexts.
        2. Check for the use of default admin usernames in Ansible task declarations, especially within modules like `user`, `shell`, or `command`.
        3. Verify the explicit use of admin usernames in execution contexts within the `shell`, `command`, or `raw` modules. For example, `mysql -u root`.

        Follow these steps in your analysis: 
        1. Carefully review the entire script line by line.
          - Focus on lines where usernames are assigned directly using variables, for example, `vars: my_user: "root"`. 
          - Focus on commands where admin usernames (e.g., 'root', 'admin') are explicitly mentioned. Ignore instances where the username is not directly specified in the command.
          - Look for lines with admin usernames in module parameters like `name`, specifically in `user` tasks, e.g., `- name: "Ensure user is present." user: name: "root"`.
          - Identify explicit admin usernames in execution tasks like `shell: "mysql -u root"` or `command: "some-command --user=root"`.
        2. Ignore the following:
          - Exclude anything related to passwords or sensitive data.
          - Ignore username assignments tied to file or directory ownership, e.g., `file: /root/.ssh/file_name`, `owner: root`.
          - Ignore common ownership assignments like 'owner: root' or 'group: root' in system resources
          - Disregard `user` module tasks meant for user creation or setting with service-specific usernames (e.g., ElasticSearch, MySQL).
          - Skip variables or parameters that include admin labels in their names but do not correspond to username use (e.g., `root_user`, `admin_password`).
          - Avoid any configuration settings that involve default service usernames within the Ansible roles.
          - Exclude lines that involve constructing variable or file names through functions or logic (e.g., regex).
          - Ignore operations like creating symbolic links unless admin usernames are directly involved.
          - Disregard lines where user or group ownership is assigned to 'admin' or 'root', as this is common for system or sensitive resources.
          - Ignore cases where admin privilege use is assumed or implicit, focusing only on commands with directly stated admin usernames.
          - Disregard implicit privilege usage where the username is not visibly part of the command.
          - Diregard copying a private key (e.g., SSH) to the root user's home directory.
        3. **Specifically ignore expressions similar to the following:**
          - `default['service']['other']['app_owner']: 'root'` or similar ownership assignments within configurations
          - 'group: root' or 'owner: root'

